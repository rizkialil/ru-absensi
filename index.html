            </div>

            <div class="flex flex-wrap items-center justify-between gap-3">
              <!-- Mode Harian vs Mingguan -->
              <div class="inline-flex p-1 rounded-2xl bg-[#F4F5FA]">
                <button id="btn-view-daily" class="px-4 py-1.5 rounded-xl text-xs font-bold transition ${state.scheduleViewMode === 'daily' ? 'bg-white text-[#6C5CE7] shadow-sm' : 'text-[#5A607F]'}">Tampilan Harian</button>
                <button id="btn-view-weekly" class="px-4 py-1.5 rounded-xl text-xs font-bold transition ${state.scheduleViewMode === 'weekly' ? 'bg-white text-[#6C5CE7] shadow-sm' : 'text-[#5A607F]'}">Tampilan Mingguan</button>
              </div>

              <!-- Filter Guru, Kelas, Mapel -->
              <div class="flex flex-wrap items-center gap-2">
                <select id="sch-f-teacher" class="px-3 py-2 rounded-xl bg-[#F4F5FA] text-xs font-semibold text-[#5A607F]">
                  <option value="all">Semua Guru</option>
                  ${state.teachers.map(t => `<option value="${t.id}" ${state.scheduleFilterTeacher === t.id ? 'selected' : ''}>${escapeHtml(t.nama_lengkap)}</option>`).join('')}
                </select>
                <select id="sch-f-class" class="px-3 py-2 rounded-xl bg-[#F4F5FA] text-xs font-semibold text-[#5A607F]">
                  <option value="all">Semua Kelas</option>
                  ${state.classes.map(c => `<option value="${c.id}" ${state.scheduleFilterClass === c.id ? 'selected' : ''}>${escapeHtml(c.nama_kelas)}</option>`).join('')}
                </select>
                <select id="sch-f-subject" class="px-3 py-2 rounded-xl bg-[#F4F5FA] text-xs font-semibold text-[#5A607F]">
                  <option value="all">Semua Mapel</option>
                  ${state.subjects.map(s => `<option value="${s.id}" ${state.scheduleFilterSubject === s.id ? 'selected' : ''}>${escapeHtml(s.nama_mapel)}</option>`).join('')}
                </select>
              </div>
            </div>

            ${state.scheduleViewMode === 'daily' ? `
              <!-- Day Pills -->
              <div class="flex flex-wrap gap-1.5 pb-2 border-b border-[#F0F1F7]">
                ${['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'].map(h => `
                  <button data-schday="${h}" class="sch-day-pill px-4 py-1.5 rounded-full text-xs font-bold transition ${
                    state.scheduleFilterDay === h ? 'bg-[#6C5CE7] text-white' : 'bg-[#F4F5FA] text-[#5A607F] hover:bg-[#EFEFFD]'
                  }">${h}</button>
                `).join('')}
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-[#F0F1F7] text-[11px] font-bold uppercase text-[#9499B7]">
                      <th class="py-3 pr-3">Waktu & Sesi</th>
                      <th class="py-3 px-3">Kategori</th>
                      <th class="py-3 px-3">Guru Pembina / Pengajar</th>
                      <th class="py-3 px-3">Tugas / Mata Pelajaran</th>
                      <th class="py-3 px-3">Lokasi / Kelas</th>
                      <th class="py-3 pl-3 text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[#F0F1F7] text-xs">
                    ${filteredSchedules.length === 0
                      ? `<tr><td colspan="6">${renderEmptyState({
                          icon: 'calendar-x',
                          title: 'Tidak Ada Jadwal Tugas',
                          description: `Belum ada jadwal tugas pada hari ${state.scheduleFilterDay} untuk filter ini.`,
                          actionText: 'Tambah Jadwal Baru',
                          actionId: 'btn-empty-add-sched'
                        })}</td></tr>`
                      : filteredSchedules.map(s => {
                        const tch = state.teachers.find(t => t.id === s.teacher_id);
                        const sub = state.subjects.find(x => x.id === s.subject_id);
                        const cls = state.classes.find(c => c.id === s.class_id);
                        const kat = getKategoriInfo(s.kategori || 'KBM_REGULER');
                        const judul = s.nama_tugas || (sub ? sub.nama_mapel : kat.label);
                        const lokasi = s.lokasi || (cls ? cls.nama_kelas : '-');
                        return `
                          <tr class="hover:bg-[#F4F5FA]/60">
                            <td class="py-3 pr-3">
                              <p class="font-extrabold text-[#6C5CE7]">Jam ke-${s.jam_ke}</p>
                              <p class="text-[11px] font-bold text-[#1E2029] tabular-nums">${s.jam_mulai} - ${s.jam_selesai}</p>
                            </td>
                            <td class="py-3 px-3">
                              <span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-bold ${kat.badgeClass}">${kat.label}</span>
                            </td>
                            <td class="py-3 px-3">
                              <p class="font-bold text-[#1E2029]">${escapeHtml(tch?.nama_lengkap || '-')}</p>
                              <p class="text-[11px] text-[#9499B7]">${escapeHtml(tch?.kode_guru || '-')}</p>
                            </td>
                            <td class="py-3 px-3">
                              <p class="font-bold text-[#1E2029]">${escapeHtml(judul)}</p>
                              ${sub && s.kategori === 'KBM_REGULER' ? `<p class="text-[11px] text-[#9499B7]">${escapeHtml(sub.kode_mapel)}</p>` : ''}
                            </td>
                            <td class="py-3 px-3 font-semibold text-[#5A607F]">${escapeHtml(lokasi)}</td>
                            <td class="py-3 pl-3 text-right">
                              <button data-edit-sch="${s.id}" class="btn-edit-sch p-2 rounded-xl bg-[#F4F5FA] text-[#5A607F] hover:text-[#1E2029]"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                              <button data-del-sch="${s.id}" class="btn-del-sch p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                            </td>
                          </tr>
                        `;
                      }).join('')
                    }
                  </tbody>
                </table>
              </div>
            ` : `
              <!-- Weekly Grid View -->
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                ${['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'].map(hari => {
                  const dayItems = filteredSchedules.filter(s => s.hari === hari);
                  return `
                    <div class="rounded-2xl bg-[#F4F5FA] p-4 border border-[#ECE9FE]">
                      <div class="flex items-center justify-between mb-3">
                        <h4 class="text-sm font-extrabold text-[#1E2029]">${hari}</h4>
                        <span class="px-2.5 py-0.5 rounded-full bg-white text-[#6C5CE7] text-[11px] font-bold">${dayItems.length} Sesi</span>
                      </div>
                      <div class="space-y-2">
                        ${dayItems.length === 0
                          ? `<p class="text-xs text-[#9499B7] py-3 text-center">Kosong</p>`
                          : dayItems.map(s => {
                            const tch = state.teachers.find(t => t.id === s.teacher_id);
                            const sub = state.subjects.find(x => x.id === s.subject_id);
                            const cls = state.classes.find(c => c.id === s.class_id);
                            const kat = getKategoriInfo(s.kategori || 'KBM_REGULER');
                            const judul = s.nama_tugas || (sub ? sub.nama_mapel : kat.label);
                            const lokasi = s.lokasi || (cls ? cls.nama_kelas : '-');
                            return `
                              <div class="bg-white p-3 rounded-xl shadow-sm border border-white space-y-1">
                                <div class="flex justify-between items-center text-[10px]">
                                  <span class="px-2 py-0.5 rounded font-bold ${kat.badgeClass}">${kat.label}</span>
                                  <span class="font-bold text-[#6C5CE7] tabular-nums">${s.jam_mulai}–${s.jam_selesai}</span>
                                </div>
                                <p class="text-xs font-bold text-[#1E2029] truncate">${escapeHtml(judul)}</p>
                                <div class="flex items-center justify-between text-[11px] text-[#5A607F]">
                                  <span class="truncate">${escapeHtml(tch?.nama_lengkap || '-')}</span>
                                  <span class="font-semibold shrink-0 text-[#6C5CE7]">${escapeHtml(lokasi)}</span>
                                </div>
                              </div>
                            `;
                          }).join('')
                        }
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;

      document.getElementById('btn-view-daily').onclick = () => { state.scheduleViewMode = 'daily'; renderAdminTabContent(); };
      document.getElementById('btn-view-weekly').onclick = () => { state.scheduleViewMode = 'weekly'; renderAdminTabContent(); };

      document.querySelectorAll('.sch-kat-pill').forEach(b => {
        b.onclick = () => { state.scheduleFilterKategori = b.dataset.schkat; renderAdminTabContent(); };
      });

      document.querySelectorAll('.sch-day-pill').forEach(b => {
        b.onclick = () => { state.scheduleFilterDay = b.dataset.schday; renderAdminTabContent(); };
      });

      document.getElementById('sch-f-teacher').onchange = (e) => { state.scheduleFilterTeacher = e.target.value; renderAdminTabContent(); };
      document.getElementById('sch-f-class').onchange = (e) => { state.scheduleFilterClass = e.target.value; renderAdminTabContent(); };
      document.getElementById('sch-f-subject').onchange = (e) => { state.scheduleFilterSubject = e.target.value; renderAdminTabContent(); };

      document.getElementById('btn-add-schedule').onclick = () => openScheduleFormModal(null);
      const btnEmptySched = document.getElementById('btn-empty-add-sched');
      if (btnEmptySched) btnEmptySched.onclick = () => openScheduleFormModal(null);
      document.getElementById('btn-slot-settings').onclick = () => openLessonSlotsModal();
      document.getElementById('btn-import-schedule-excel').onclick = () => openScheduleExcelImportModal();

      document.querySelectorAll('.btn-edit-sch').forEach(b => {
        b.onclick = () => openScheduleFormModal(state.schedules.find(x => x.id === b.dataset.editSch));
      });
      document.querySelectorAll('.btn-del-sch').forEach(b => {
        b.onclick = () => {
          const s = state.schedules.find(x => x.id === b.dataset.delSch);
          confirmDialog({
            title: 'Hapus Jadwal Tugas',
            message: `Hapus jadwal hari ${s.hari} pukul ${s.jam_mulai}–${s.jam_selesai}?`,
            onConfirm: async () => {
              await dbAdapter.deleteDocument('teaching_schedules', s.id);
              showToast('Jadwal berhasil dihapus.', 'success');
              renderAdminTabContent();
            }
          });
        };
      });
    }

    function openScheduleFormModal(sch = null) {
      const activeYear = state.schoolYears.find(y => y.is_active) || state.schoolYears[0];
      const slots = (state.settings?.lesson_slots || getDefaultSettings().lesson_slots);
      const currKat = sch?.kategori || 'KBM_REGULER';
      const isKbmInitial = currKat === 'KBM_REGULER';

      openModal(`
        <div class="p-6">
          <h3 class="text-lg font-extrabold text-[#1E2029] mb-4">${sch ? 'Edit Jadwal Tugas & Mengajar' : 'Tambah Jadwal Tugas & Mengajar'}</h3>
          <form id="form-schedule" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-[#5A607F] mb-1">Kategori Tugas / Peran Guru *</label>
              <select id="sch-kategori" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold focus:outline-none">
                ${Object.entries(KATEGORI_TUGAS).map(([k, v]) => `
                  <option value="${k}" ${currKat === k ? 'selected' : ''}>${v.label} - ${v.desc}</option>
                `).join('')}
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Guru / Pembina *</label>
                <select id="sch-teacher" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-semibold">
                  ${state.teachers.filter(t => t.status === 'aktif').map(t => `<option value="${t.id}" ${sch?.teacher_id === t.id ? 'selected' : ''}>${escapeHtml(t.nama_lengkap)} (${t.kode_guru})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Hari *</label>
                <select id="sch-hari" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-semibold">
                  ${['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'].map(h => `<option value="${h}" ${(sch?.hari || state.scheduleFilterDay) === h ? 'selected' : ''}>${h}</option>`).join('')}
                </select>
              </div>
            </div>

            <!-- Bagian Form Khusus KBM Reguler -->
            <div id="sch-kbm-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 ${isKbmInitial ? '' : 'hidden'}">
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Mata Pelajaran *</label>
                <select id="sch-subject" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-semibold">
                  ${state.subjects.filter(s => s.status === 'aktif').map(s => `<option value="${s.id}" ${sch?.subject_id === s.id ? 'selected' : ''}>${escapeHtml(s.nama_mapel)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Kelas *</label>
                <select id="sch-class" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-semibold">
                  ${state.classes.filter(c => c.status === 'aktif').map(c => `<option value="${c.id}" ${sch?.class_id === c.id ? 'selected' : ''}>${escapeHtml(c.nama_kelas)}</option>`).join('')}
                </select>
              </div>
            </div>

            <!-- Bagian Form Khusus Non-KBM (Piket, Tahfidz, Sorogan, OSIS, Ekskul, Jumat) -->
            <div id="sch-nonkbm-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 ${isKbmInitial ? 'hidden' : ''}">
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Nama Tugas / Halaqah / Kegiatan *</label>
                <input id="sch-namatugas" type="text" value="${escapeHtml(sch?.nama_tugas || '')}" placeholder="Contoh: Halaqah Juz 30 / Piket Pagi" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-medium focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Lokasi / Ruang / Tempat *</label>
                <input id="sch-lokasi" type="text" value="${escapeHtml(sch?.lokasi || '')}" placeholder="Contoh: Masjid Lt. 2 / Ruang Piket" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-medium focus:outline-none" />
              </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Jam Ke / Sesi *</label>
                <select id="sch-jamke" class="w-full px-3 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold">
                  <option value="0" ${(sch?.jam_ke === 0) ? 'selected' : ''}>Sesi Pagi / Subuh</option>
                  ${slots.map(sl => `<option value="${sl.jam_ke}" ${(sch?.jam_ke ?? 1) == sl.jam_ke ? 'selected' : ''}>Jam ke-${sl.jam_ke}</option>`).join('')}
                  <option value="9" ${(sch?.jam_ke === 9) ? 'selected' : ''}>Sesi Sore (Jam 9)</option>
                  <option value="10" ${(sch?.jam_ke === 10) ? 'selected' : ''}>Sesi Sore/Malam (Jam 10)</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Jam Mulai *</label>
                <input id="sch-mulai" type="time" required value="${sch?.jam_mulai || slots[0]?.jam_mulai || '07:30'}" class="w-full px-3 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold tabular-nums" />
              </div>
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Jam Selesai *</label>
                <input id="sch-selesai" type="time" required value="${sch?.jam_selesai || slots[0]?.jam_selesai || '08:15'}" class="w-full px-3 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold tabular-nums" />
              </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="document.getElementById('modal-backdrop').classList.add('hidden')" class="px-4 py-2 rounded-xl bg-[#F4F5FA] text-xs font-bold">Batal</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-[#6C5CE7] text-white text-xs font-bold">Simpan Jadwal</button>
            </div>
          </form>
        </div>
      `, 'max-w-lg');

      // Toggle Dinamis KBM vs Non-KBM
      const katSelect = document.getElementById('sch-kategori');
      const kbmFields = document.getElementById('sch-kbm-fields');
      const nonKbmFields = document.getElementById('sch-nonkbm-fields');
      katSelect.onchange = (e) => {
        const isKbm = e.target.value === 'KBM_REGULER';
        kbmFields.classList.toggle('hidden', !isKbm);
        nonKbmFields.classList.toggle('hidden', isKbm);
        if (!isKbm) {
          const taskInput = document.getElementById('sch-namatugas');
          const locInput = document.getElementById('sch-lokasi');
          if (taskInput && !taskInput.value) {
            if (e.target.value === 'GURU_PIKET') { taskInput.value = 'Piket KBM & Ketertiban'; locInput.value = 'Ruang Piket / Lobi'; }
            else if (e.target.value === 'TAHFIDZ') { taskInput.value = 'Halaqah Tahfidz Al-Qur\'an'; locInput.value = 'Masjid Sekolah Lt. 1'; }
            else if (e.target.value === 'SOROGAN') { taskInput.value = 'Sorogan Kitab Kuning'; locInput.value = 'Musholla / Serambi'; }
            else if (e.target.value === 'PEMBINA_OSIS') { taskInput.value = 'Pembinaan & Rapat OSIS'; locInput.value = 'Ruang OSIS'; }
            else if (e.target.value === 'PEMBINA_EKSKUL') { taskInput.value = 'Pembinaan Ekstrakurikuler'; locInput.value = 'Lapangan / Aula'; }
            else if (e.target.value === 'KEGIATAN_JUMAT') { taskInput.value = 'Sholat Dhuha & Tausiyah Jumat'; locInput.value = 'Masjid Utama'; }
          }
        }
      };

      // Auto-fill jam mulai & selesai saat jam ke dipilih
      document.getElementById('sch-jamke').onchange = (e) => {
        const found = slots.find(sl => sl.jam_ke == e.target.value);
        if (found) {
          document.getElementById('sch-mulai').value = found.jam_mulai;
          document.getElementById('sch-selesai').value = found.jam_selesai;
        }
      };

      document.getElementById('form-schedule').onsubmit = async (e) => {
        e.preventDefault();
        const kategori = document.getElementById('sch-kategori').value;
        const isKbm = kategori === 'KBM_REGULER';
        const nama_tugas = isKbm ? '' : document.getElementById('sch-namatugas').value.trim();
        const lokasi = isKbm ? '' : document.getElementById('sch-lokasi').value.trim();
        const subject_id = isKbm ? document.getElementById('sch-subject').value : '';
        const class_id = isKbm ? document.getElementById('sch-class').value : '';

        if (!isKbm && !nama_tugas) {
          showToast('Nama Tugas / Kegiatan wajib diisi untuk kategori non-KBM.', 'warning');
          return;
        }

        const payload = {
          teacher_id: document.getElementById('sch-teacher').value,
          hari: document.getElementById('sch-hari').value,
          kategori,
          nama_tugas,
          lokasi,
          subject_id,
          class_id,
          jam_ke: Number(document.getElementById('sch-jamke').value),
          jam_mulai: document.getElementById('sch-mulai').value,
          jam_selesai: document.getElementById('sch-selesai').value,
          school_year_id: activeYear?.id || ''
        };

        const conflictMsg = checkScheduleConflict({ id: sch?.id, ...payload });
        if (conflictMsg) {
          showToast(conflictMsg, 'error');
          return;
        }

        if (sch) {
          await dbAdapter.setDocument('teaching_schedules', sch.id, payload);
        } else {
          await dbAdapter.addDocument('teaching_schedules', payload);
        }
        await recordAuditLog({
          aksi: sch ? 'UPDATE_SCHEDULE' : 'CREATE_SCHEDULE',
          entitas: 'teaching_schedules',
          target_id: sch?.id || 'NEW',
          detail_perubahan: `Jadwal [${kategori}] ${payload.hari} (${payload.jam_mulai}-${payload.jam_selesai})`
        });
        closeModal();
        showToast('Jadwal tugas berhasil disimpan.', 'success');
        renderAdminTabContent();
      };
    }

    function openLessonSlotsModal() {
      const cfg = state.settings || getDefaultSettings();
      const slots = [...(cfg.lesson_slots || getDefaultSettings().lesson_slots)];

      openModal(`
        <div class="p-6">
          <h3 class="text-lg font-extrabold text-[#1E2029] mb-4">Template Jam Pelajaran</h3>

      document.getElementById('input-sch-excel-file').onchange = (e) => {

          const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
          const preview = document.getElementById('sch-import-preview-area');

          parsedSchedules = raw.map((r, idx) => {
            const rawKat = String(r.kategori || 'KBM_REGULER').trim().toUpperCase();
            const kategori = KATEGORI_TUGAS[rawKat] ? rawKat : 'KBM_REGULER';
            const isKbm = kategori === 'KBM_REGULER';
            const kodeGuru = String(r.kode_guru || '').trim().toUpperCase();
            const hari = String(r.hari || '').trim();
            const kodeMapel = String(r.kode_mapel || '').trim().toUpperCase();

            const namaTugas = String(r.nama_tugas || '').trim();
            const lokasi = String(r.lokasi || '').trim();

            const jamMulai = String(r.jam_mulai || '').trim();
            const jamSelesai = String(r.jam_selesai || '').trim();

            const tch = state.teachers.find(t => t.kode_guru.toUpperCase() === kodeGuru);
            const sub = isKbm ? state.subjects.find(s => s.kode_mapel.toUpperCase() === kodeMapel) : null;
            const cls = isKbm ? state.classes.find(c => c.nama_kelas.toLowerCase() === namaKelas.toLowerCase()) : null;

            let error = '';
            if (!tch) error = `Kode guru "${kodeGuru}" tidak ditemukan`;
            else if (!['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'].includes(hari)) error = `Hari "${hari}" tidak valid`;
            else if (isKbm && !sub) error = `Kode mapel "${kodeMapel}" tidak ditemukan`;
            else if (isKbm && !cls) error = `Kelas "${namaKelas}" tidak ditemukan`;
            else if (!isKbm && !namaTugas) error = `Nama tugas wajib diisi untuk non-KBM`;
            else {
              const cErr = checkScheduleConflict({
                teacher_id: tch.id,
                class_id: cls?.id || null,
                school_year_id: activeYear?.id || '',
                hari,
                jam_mulai: jamMulai,
                jam_selesai: jamSelesai,
                kategori
              });
              if (cErr) error = cErr;
            }

            return {
              rowNum: idx + 2,
              tch,
              sub,
              cls,
              kategori,
              nama_tugas: namaTugas,
              lokasi,
              hari,
              jamKe,
              jamMulai,
              jamSelesai,
              valid: !error,
              error
            };
          });

          const validCount = parsedSchedules.filter(x => x.valid).length;
          preview.innerHTML = `
            <div class="max-h-52 overflow-y-auto border border-[#F0F1F7] rounded-2xl">
              <table class="w-full text-left text-xs">
                <thead class="bg-[#F4F5FA] text-[11px] font-bold text-[#9499B7]">
                  <tr><th class="p-2.5">Baris</th><th class="p-2.5">Kategori</th><th class="p-2.5">Guru</th><th class="p-2.5">Tugas / Mapel</th><th class="p-2.5">Hari & Jam</th><th class="p-2.5">Status</th></tr>
                </thead>
                <tbody class="divide-y divide-[#F0F1F7]">
                  ${parsedSchedules.map(p => {
                    const k = getKategoriInfo(p.kategori);
                    const judul = p.kategori === 'KBM_REGULER' ? (p.sub?.nama_mapel || '-') : p.nama_tugas;
                    return `
                      <tr>
                        <td class="p-2.5">${p.rowNum}</td>
                        <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${k.badgeClass}">${k.label}</span></td>
                        <td class="p-2.5 font-bold">${escapeHtml(p.tch?.nama_lengkap || '-')}</td>
                        <td class="p-2.5">${escapeHtml(judul)}</td>
                        <td class="p-2.5">${p.hari} (${p.jamMulai}-${p.jamSelesai})</td>
                        <td class="p-2.5">${p.valid ? '<span class="text-emerald-600 font-bold">Valid</span>' : `<span class="text-rose-600 font-bold">${escapeHtml(p.error)}</span>`}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
            <div class="flex justify-end pt-2">
              <button id="btn-confirm-sch-import" ${validCount === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl bg-[#6C5CE7] disabled:bg-[#D5D7E8] text-white text-xs font-bold">
                Impor ${validCount} Jadwal Valid
              </button>
            </div>
          `;

          const btn = document.getElementById('btn-confirm-sch-import');
          if (btn) {
            btn.onclick = async () => {
              for (const item of parsedSchedules.filter(x => x.valid)) {
                await dbAdapter.addDocument('teaching_schedules', {
                  teacher_id: item.tch.id,
                  kategori: item.kategori,
                  nama_tugas: item.nama_tugas || '',
                  lokasi: item.lokasi || '',
                  subject_id: item.sub?.id || '',
                  class_id: item.cls?.id || '',
                  school_year_id: activeYear?.id || '',
                  hari: item.hari,
                  jam_ke: item.jamKe,
                  jam_mulai: item.jamMulai,
                  jam_selesai: item.jamSelesai
                });
              }
              closeModal();
              showToast(`${validCount} jadwal tugas/mengajar berhasil diimpor.`, 'success');
              renderAdminTabContent();
            };
          }
        };
        reader.readAsBinaryString(file);
      };
    }

          </div>

                </tr>

                ${state.teachers.map(t => {
                  const tok = state.qrTokens.find(q => q.teacher_id === t.id && q.is_active) || state.qrTokens.find(q => q.teacher_id === t.id);
                  return `
                    <tr class="hover:bg-[#F4F5FA]/60">
                      <td class="py-3 pr-3">
                        <p class="font-bold text-[#1E2029]">${escapeHtml(t.nama_lengkap)}</p>

                      </td>
                      <td class="py-3 px-3 font-mono font-bold text-[#6C5CE7]">${escapeHtml(tok ? tok.token : 'Belum Ada Token')}</td>
                      <td class="py-3 px-3">
                        ${tok?.is_active
                          ? `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">Aktif</span>`
                          : `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700">Nonaktif</span>`
                        }
                      </td>
                      <td class="py-3 pl-3 text-right space-x-1">

                        ${tok ? `
                          <button data-toggle-tok="${tok.id}" class="btn-qr-toggle px-3 py-1.5 rounded-xl bg-[#F4F5FA] text-[#5A607F] font-bold hover:text-[#1E2029]">
                            ${tok.is_active ? 'Nonaktifkan' : 'Aktifkan'}
                          </button>
                        ` : ''}
                        <button data-regen-tid="${t.id}" class="btn-qr-regen px-3 py-1.5 rounded-xl bg-amber-50 text-amber-700 font-bold hover:bg-amber-500 hover:text-white transition">
                          Buat Ulang Token
                        </button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById('btn-qr-print-batch').onclick = () => printTeacherQrCards(state.teachers.filter(t => t.status === 'aktif'));

      document.querySelectorAll('.btn-qr-show-card').forEach(b => {
        b.onclick = () => openSingleQrCardModal(state.teachers.find(x => x.id === b.dataset.qrCard));
      });

      document.querySelectorAll('.btn-qr-toggle').forEach(b => {
        b.onclick = async () => {
          const tok = state.qrTokens.find(q => q.id === b.dataset.toggleTok);
          if (!tok) return;
          const nextState = !tok.is_active;
          await dbAdapter.setDocument('qr_tokens', tok.id, { ...tok, is_active: nextState });
          await recordAuditLog({
            aksi: nextState ? 'ACTIVATE_QR_TOKEN' : 'DEACTIVATE_QR_TOKEN',
            entitas: 'qr_tokens',
            target_id: tok.token,
            detail_perubahan: `Mengubah status token QR menjadi ${nextState ? 'Aktif' : 'Nonaktif'}`
          });
          showToast(`Token QR berhasil di-${nextState ? 'aktifkan' : 'nonaktifkan'}.`, 'success');
          renderAdminTabContent();
        };
      });

      document.querySelectorAll('.btn-qr-regen').forEach(b => {
        b.onclick = () => {
          const t = state.teachers.find(x => x.id === b.dataset.regenTid);
          confirmDialog({
            title: 'Buat Ulang Token QR Code',
            message: `Token QR lama milik ${t.nama_lengkap} akan dicabut permanen dan digantikan token acak baru. Kartu lama tidak akan bisa dipakai lagi. Lanjutkan?`,
            confirmText: 'Ya, Buat Ulang Token',
            onConfirm: async () => {
              const jakarta = getJakartaNow();
              for (const oldTok of state.qrTokens.filter(q => q.teacher_id === t.id && q.is_active)) {
                await dbAdapter.setDocument('qr_tokens', oldTok.id, { ...oldTok, is_active: false, revoked_at: jakarta.isoTimestamp });
              }
              const newToken = generateRandomToken();
              await dbAdapter.setDocument('qr_tokens', newToken, {
                token: newToken,
                teacher_id: t.id,
                is_active: true,
                created_at: jakarta.isoTimestamp
              });
              await recordAuditLog({
                aksi: 'REGENERATE_QR_TOKEN',
                entitas: 'qr_tokens',
                target_id: newToken,
                detail_perubahan: `Regenerasi token QR baru untuk ${t.nama_lengkap} (${t.kode_guru})`
              });
              showToast('Token QR baru berhasil dibuat!', 'success');
              renderAdminTabContent();
            }
          });
        };
      });
    }

    // -------------------------------------------------------------------------
    // MODUL 8: RIWAYAT ABSENSI (MULTI-PERAN, FILTER LENGKAP, BELUM ABSEN VS TIDAK HADIR)
    // -------------------------------------------------------------------------
    function renderHistoryModule(container) {
      let rows = [];

      if (state.historyFilterDate) {
        const summary = computeDailySummary(state.historyFilterDate, state.historyFilterKategori);
        rows = summary.detailedRows.map(r => {
          const existingRec = state.attendanceRecords.find(
            x => x.teacher_id === r.teacher.id && (x.schedule_id === r.schedule?.id || (!x.schedule_id && (r.schedule?.kategori || 'KBM_REGULER') === 'KBM_REGULER')) && x.tanggal === state.historyFilterDate
          );
          return {
            recordId: existingRec?.id || null,
            teacher: r.teacher,
            schedule: r.schedule,
            kategori: r.kategori,
            katInfo: r.katInfo,
            judulTugas: r.judulTugas,
            lokasi: r.lokasi,
            tanggal: state.historyFilterDate,
            hari: summary.hariName,
            jamJadwal: r.jamJadwal,
            waktuAbsen: r.waktuAbsen,
            status: r.status,
            metode: r.metode,
            menitTerlambat: r.menitTerlambat || (existingRec?.menit_terlambat || 0),
            isDispensasi: Boolean(r.isDispensasi ?? existingRec?.is_dispensasi),
            catatan: existingRec?.catatan_koreksi || ''
          };
        });
      } else {
        rows = state.attendanceRecords.map(rec => {
          const t = state.teachers.find(x => x.id === rec.teacher_id);
          const sub = state.subjects.find(s => s.id === rec.subject_id);
          const cls = state.classes.find(c => c.id === rec.class_id);
          const sched = state.schedules.find(s => s.id === rec.schedule_id);
          const kat = rec.kategori || sched?.kategori || 'KBM_REGULER';
          const katInfo = getKategoriInfo(kat);
          const judulTugas = rec.nama_tugas || sched?.nama_tugas || (sub ? sub.nama_mapel : katInfo.label);
          const lokasi = rec.lokasi || sched?.lokasi || (cls ? cls.nama_kelas : '-');
          return {
            recordId: rec.id,
            teacher: t || { id: rec.teacher_id, nama_lengkap: 'Guru Terhapus', kode_guru: '-' },
            schedule: sched || null,
            kategori: kat,
            katInfo,
            judulTugas,
            lokasi,
            tanggal: rec.tanggal,
            hari: rec.hari,
            jamJadwal: (rec.jadwal_jam_mulai && rec.jadwal_jam_selesai) ? `${rec.jadwal_jam_mulai}–${rec.jadwal_jam_selesai}` : (rec.jadwal_jam_mulai || '-'),
            waktuAbsen: rec.waktu_absensi,
            status: rec.status,
            metode: rec.metode,
            menitTerlambat: rec.menit_terlambat || 0,
            isDispensasi: Boolean(rec.is_dispensasi),
            catatan: rec.catatan_koreksi || ''
          };
        });
      }

      // Terapkan filter tambahan
      rows = rows.filter(r => {
        if (state.historyFilterKategori !== 'all' && (r.kategori || 'KBM_REGULER') !== state.historyFilterKategori) return false;
        if (state.historyFilterMonth && !r.tanggal.startsWith(state.historyFilterMonth)) return false;
        if (state.historyFilterYear && !r.tanggal.startsWith(state.historyFilterYear)) return false;
        if (state.historyFilterTeacher !== 'all' && r.teacher.id !== state.historyFilterTeacher) return false;
        if (state.historyFilterStatus !== 'all' && r.status !== state.historyFilterStatus) return false;
        if (state.historyFilterMethod !== 'all' && r.metode !== state.historyFilterMethod) return false;
        return true;
      });

      container.innerHTML = `

          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-2xl font-extrabold text-[#1E2029]">Riwayat Absensi</h2>
            </div>
            <button id="btn-open-correction-new" class="px-4 py-2.5 rounded-xl bg-[#6C5CE7] hover:bg-[#5A4BD1] text-white text-xs font-bold inline-flex items-center gap-1.5">
              <i data-lucide="file-edit" class="w-4 h-4"></i> Input Izin / Koreksi
            </button>
          </div>

          <!-- Filter Bar -->
          <div class="bg-white rounded-3xl p-5 shadow-bento border border-white space-y-4">
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-2.5">
              <div>
                <label class="block text-[10px] font-bold text-[#9499B7] mb-1">Filter Tanggal</label>
                <input id="hf-date" type="date" value="${state.historyFilterDate}" class="w-full px-3 py-2 rounded-xl bg-[#F4F5FA] text-xs font-semibold" />
              </div>
              <div>
                <label class="block text-[10px] font-bold text-[#9499B7] mb-1">Filter Bulan</label>
                <input id="hf-month" type="month" value="${state.historyFilterMonth}" class="w-full px-3 py-2 rounded-xl bg-[#F4F5FA] text-xs font-semibold" />
              </div>
              <div>
                <label class="block text-[10px] font-bold text-[#9499B7] mb-1">Kategori Tugas</label>
                <select id="hf-kategori" class="w-full px-3 py-2 rounded-xl bg-[#F4F5FA] text-xs font-semibold">
                  <option value="all">Semua Kategori</option>
                  ${Object.entries(KATEGORI_TUGAS).map(([k, v]) => `
                    <option value="${k}" ${state.historyFilterKategori === k ? 'selected' : ''}>${v.label}</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-[#9499B7] mb-1">Guru</label>
                <select id="hf-teacher" class="w-full px-3 py-2 rounded-xl bg-[#F4F5FA] text-xs font-semibold">
                  <option value="all">Semua Guru</option>

    // -------------------------------------------------------------------------
    // MODUL 10: LAPORAN & REKAPITULASI (MULTI-PERAN, PERSENTASE SESI TUGAS)
    // -------------------------------------------------------------------------
    function buildReportData() {
      const activeTeachers = state.teachers.filter(t => t.status === 'aktif');
      let startDate = state.reportDate;
      let endDate = state.reportDate;
      let periodLabel = `Harian (${state.reportDate})`;

      if (state.reportType === 'monthly') {
        const [y, m] = state.reportMonth.split('-').map(Number);
        const lastDay = new Date(y, m, 0).getDate();
        startDate = `${state.reportMonth}-01`;
        endDate = `${state.reportMonth}-${String(lastDay).padStart(2, '0')}`;
        periodLabel = `Bulanan (${BULAN_LIST[m - 1]} ${y})`;
      } else if (state.reportType === 'period' || state.reportType === 'teacher') {
        startDate = state.reportStartDate;
        endDate = state.reportEndDate;
        periodLabel = `Periode (${startDate} s.d. ${endDate})`;
      }

      // Generate daftar tanggal dalam rentang [startDate .. endDate]
      const dates = [];
      let cursor = new Date(`${startDate}T08:00:00+07:00`);
      const endObj = new Date(`${endDate}T08:00:00+07:00`);
      let safety = 0;
      while (cursor <= endObj && safety < 366) {
        dates.push(cursor.toISOString().slice(0, 10));
        cursor.setUTCDate(cursor.getUTCDate() + 1);
        safety++;
      }

      const targetTeachers = (state.reportType === 'teacher' && state.reportTeacherId)
        ? activeTeachers.filter(t => t.id === state.reportTeacherId)
        : activeTeachers;

      const katFilter = state.reportKategori || 'all';
      const katInfo = getKategoriInfo(katFilter);
      const kategoriLabel = katFilter === 'all' ? 'Semua Tugas / Peran' : katInfo.label;

      const summaryRows = targetTeachers.map(t => {
        let totalScheduledDays = 0;
        let hadir = 0;
        let terlambat = 0;
        let tidakHadir = 0;
        let izin = 0;
        let sakit = 0;
        let belumAbsen = 0;

        dates.forEach(ds => {
          const dObj = new Date(`${ds}T08:00:00+07:00`);
          const wibDayIdx = new Date(dObj.getTime() + 7 * 3600 * 1000).getUTCDay();
          const hariName = HARI_LIST[wibDayIdx];

          // Ambil jadwal tugas guru pada hari tersebut sesuai kategori filter
          const teacherDuties = getTodaySchedulesForTeacher(t.id, hariName, katFilter);
          if (teacherDuties.length === 0) return;

          teacherDuties.forEach(dutySched => {
            totalScheduledDays++;
            const rec = state.attendanceRecords.find(
              r => r.teacher_id === t.id && (r.schedule_id === dutySched.id || (!r.schedule_id && (dutySched.kategori || 'KBM_REGULER') === 'KBM_REGULER')) && r.tanggal === ds
            );
            if (rec) {
              if (rec.status === 'Hadir') hadir++;
              else if (rec.status === 'Terlambat') terlambat++;
              else if (rec.status === 'Tidak Hadir') tidakHadir++;
              else if (rec.status === 'Izin') izin++;
              else if (rec.status === 'Sakit') sakit++;
            } else {
              const st = evaluateMissingAttendanceStatus(dutySched, ds);
              if (st === 'Tidak Hadir') tidakHadir++;
              else belumAbsen++;
            }
          });
        });

        const totalPresent = hadir + terlambat;
        const pct = totalScheduledDays > 0 ? Math.round((totalPresent / totalScheduledDays) * 100) : 0;

        return {
          kode_guru: t.kode_guru,
          nama_lengkap: t.nama_lengkap,
          totalScheduledDays,
          hadir,
          terlambat,
          tidakHadir,
          izin,
          sakit,
          belumAbsen,
          pct
        };
      });

      return { periodLabel, kategoriLabel, summaryRows };
    }

    function renderReportsModule(container) {
      if (!state.reportTeacherId && state.teachers.length > 0) {
        state.reportTeacherId = state.teachers[0].id;
      }
      const { periodLabel, kategoriLabel, summaryRows } = buildReportData();

      container.innerHTML = `
        <div class="space-y-5 animate-fade-up">

      });

      if (inKat) inKat.onchange = (e) => { state.reportKategori = e.target.value; renderAdminTabContent(); };
      const inDate = document.getElementById('rep-in-date');
      if (inDate) inDate.onchange = (e) => { state.reportDate = e.target.value; renderAdminTabContent(); };
      const inMonth = document.getElementById('rep-in-month');
      if (inMonth) inMonth.onchange = (e) => { state.reportMonth = e.target.value; renderAdminTabContent(); };
      const inTeacher = document.getElementById('rep-in-teacher');
      if (inTeacher) inTeacher.onchange = (e) => { state.reportTeacherId = e.target.value; renderAdminTabContent(); };
      const inStart = document.getElementById('rep-in-start');
      if (inStart) inStart.onchange = (e) => { state.reportStartDate = e.target.value; renderAdminTabContent(); };
      const inEnd = document.getElementById('rep-in-end');
      if (inEnd) inEnd.onchange = (e) => { state.reportEndDate = e.target.value; renderAdminTabContent(); };

      // Ekspor Excel
      document.getElementById('btn-rep-excel').onclick = () => {
        const excelRows = summaryRows.map(r => ({
          'Kode Guru': r.kode_guru,
          'Nama Guru': r.nama_lengkap,
          'Kategori Tugas': kategoriLabel,
          'Total Sesi Terjadwal': r.totalScheduledDays,
          'Hadir': r.hadir,
          'Terlambat': r.terlambat,
          'Tidak Hadir': r.tidakHadir,
          'Izin': r.izin,
          'Sakit': r.sakit,
          'Persentase Kehadiran (%)': `${r.pct}%`
        }));
        const ws = XLSX.utils.json_to_sheet(excelRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Rekap_Absensi');
        const katClean = (state.reportKategori || 'Semua').replace(/[^a-zA-Z0-9]/g, '_');
        XLSX.writeFile(wb, `Laporan_Absensi_${katClean}_${getJakartaNow().dateStr}.xlsx`);
        showToast('Laporan Excel berhasil diunduh.', 'success');
      };

      // Ekspor PDF
      document.getElementById('btn-rep-pdf').onclick = () => {
        if (!window.jspdf) {
          showToast('Library PDF belum siap.', 'error');
          return;
        }
        const cfg = state.settings || getDefaultSettings();
        const { jsPDF } = window.jspdf;
        const docPdf = new jsPDF();
        docPdf.setFontSize(14);
        docPdf.text(cfg.nama_instansi, 14, 16);
        docPdf.setFontSize(10);
        docPdf.text(`Laporan Rekapitulasi Absensi (${kategoriLabel}) — ${periodLabel}`, 14, 23);

        docPdf.autoTable({
          startY: 29,
          head: [['Kode', 'Nama Guru', 'Total Sesi', 'Hadir', 'Telat', 'Alpha', 'Izin', 'Sakit', 'Kehadiran']],
          body: summaryRows.map(r => [
            r.kode_guru, r.nama_lengkap, r.totalScheduledDays, r.hadir, r.terlambat, r.tidakHadir, r.izin, r.sakit, `${r.pct}%`
          ]),
          styles: { fontSize: 8 },
          headStyles: { fillColor: [108, 92, 231] }
        });

        const katClean = (state.reportKategori || 'Semua').replace(/[^a-zA-Z0-9]/g, '_');
        docPdf.save(`Laporan_Absensi_${katClean}_${getJakartaNow().dateStr}.pdf`);
        showToast('Laporan PDF berhasil diunduh.', 'success');
      };

      // Cetak Browser
      document.getElementById('btn-rep-print').onclick = () => {
        const cfg = state.settings || getDefaultSettings();
        const printArea = document.getElementById('print-area');
        printArea.classList.remove('hidden');
        printArea.innerHTML = `
          <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
            <h2 style="font-size: 16px; font-weight: 800; margin: 0;">${escapeHtml(cfg.nama_instansi)}</h2>
            <p style="font-size: 12px; color: #555; margin: 4px 0 14px;">Rekapitulasi Kehadiran Guru (${escapeHtml(kategoriLabel)}) • ${escapeHtml(periodLabel)}</p>
            <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
              <thead>
                <tr style="background: #EFEFFD; text-align: left;">
                  <th style="border: 1px solid #DDD; padding: 6px;">Kode</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Nama Guru</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Total Sesi</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Hadir</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Terlambat</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Tidak Hadir</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Izin</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Sakit</th>
                  <th style="border: 1px solid #DDD; padding: 6px;">Persentase</th>
                </tr>
              </thead>
              <tbody>
                ${summaryRows.map(r => `
                  <tr>
                    <td style="border: 1px solid #DDD; padding: 6px;">${escapeHtml(r.kode_guru)}</td>
                    <td style="border: 1px solid #DDD; padding: 6px;">${escapeHtml(r.nama_lengkap)}</td>
                    <td style="border: 1px solid #DDD; padding: 6px;">${r.totalScheduledDays}</td>
                    <td style="border: 1px solid #DDD; padding: 6px;">${r.hadir}</td>
                    <td style="border: 1px solid #DDD; padding: 6px;">${r.terlambat}</td>
                    <td style="border: 1px solid #DDD; padding: 6px;">${r.tidakHadir}</td>
                    <td style="border: 1px solid #DDD; padding: 6px;">${r.izin}</td>
                    <td style="border: 1px solid #DDD; padding: 6px;">${r.sakit}</td>
                    <td style="border: 1px solid #DDD; padding: 6px; font-weight: bold;">${r.pct}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
        setTimeout(() => {
          window.print();
          printArea.classList.add('hidden');
        }, 300);
      };
    }

    // -------------------------------------------------------------------------
    // MODUL 11: PENGATURAN APLIKASI & ATURAN WAKTU ABSENSI
    // -------------------------------------------------------------------------
    function renderSettingsModule(container) {
      const cfg = state.settings || getDefaultSettings();
      const allDays = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

      container.innerHTML = `
        <div class="max-w-3xl space-y-5 animate-fade-up">
          <div>
            <h2 class="text-2xl font-extrabold text-[#1E2029]">Pengaturan Aplikasi</h2>
          </div>

          <form id="form-app-settings" class="bg-white rounded-3xl p-6 shadow-bento border border-white space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Nama Sekolah / Instansi *</label>
                <input id="set-nama-instansi" type="text" required value="${escapeHtml(cfg.nama_instansi)}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold" />

              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">URL Logo Instansi (Opsional)</label>

              </div>
            </div>

                <h3 class="text-sm font-extrabold text-[#1E2029]">Aturan Waktu Absensi & Toleransi</h3>
              </div>

              <!-- Pilihan Mode Perlakuan Toleransi -->
              <div class="space-y-1.5">
                <label class="block text-xs font-bold text-[#5A607F]">Kebijakan Toleransi Keterlambatan</label>
                <select id="set-mode-toleransi" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] border border-transparent focus:border-[#6C5CE7] text-xs font-bold text-[#1E2029] focus:outline-none">
                  <option value="DISPENSASI_HADIR" ${(cfg.mode_toleransi || 'DISPENSASI_HADIR') === 'DISPENSASI_HADIR' ? 'selected' : ''}>

                  <option value="KETAT_TERLAMBAT" ${cfg.mode_toleransi === 'KETAT_TERLAMBAT' ? 'selected' : ''}>
                    Ketat — Melewati jam mulai langsung dicatat Terlambat
                  </option>
                </select>
              </div>

              <!-- 3 Kolom Durasi Menit -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-bold text-[#5A607F] mb-1">Mulai Buka Scan (Menit Sebelum)</label>
                  <input id="set-buka-menit" type="number" min="0" max="120" required value="${cfg.menit_buka_sebelum_jadwal}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold tabular-nums" />

                <div>
                  <label class="block text-xs font-bold text-[#5A607F] mb-1">Durasi Toleransi (Menit)</label>

                <div>
                  <label class="block text-xs font-bold text-[#5A607F] mb-1">Batas Akhir Scan (Menit Setelah)</label>
                  <input id="set-batas-menit" type="number" min="0" max="240" required value="${cfg.batas_akhir_menit_setelah_jadwal}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold tabular-nums" />

              </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <label class="block text-xs font-bold text-[#5A607F] mb-1">Kebijakan Lewat Batas Akhir Absensi</label>

              </div>

            <div>
              <label class="block text-xs font-bold text-[#5A607F] mb-2">Pengaturan Hari Kerja Aktif</label>
              <div class="flex flex-wrap gap-2">
                ${allDays.map(h => {
                  const checked = (cfg.hari_kerja || []).includes(h);
                  return `
                    <label class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-[#F4F5FA] cursor-pointer text-xs font-bold text-[#1E2029]">

                </button>

        const updated = {
          ...cfg,
          nama_instansi: document.getElementById('set-nama-instansi').value.trim(),
          logo_url: document.getElementById('set-logo-url').value.trim(),
          mode_toleransi,
          menit_buka_sebelum_jadwal: Number(document.getElementById('set-buka-menit').value),
          toleransi_terlambat_menit: Number(document.getElementById('set-toleransi-menit').value),
          batas_akhir_menit_setelah_jadwal: Number(document.getElementById('set-batas-menit').value),
          kebijakan_lewat_batas: document.getElementById('set-kebijakan').value,
          jeda_reset_publik_detik: Number(document.getElementById('set-reset-detik').value),
          hari_kerja
        };
        await dbAdapter.setDocument('attendance_settings', 'global_config', updated);
        await recordAuditLog({
          aksi: 'UPDATE_SETTINGS',
          entitas: 'attendance_settings',
          target_id: 'global_config',
          detail_perubahan: `Memperbarui pengaturan waktu (Mode: ${mode_toleransi}, Buka -${updated.menit_buka_sebelum_jadwal}m, Toleransi +${updated.toleransi_terlambat_menit}m, Batas +${updated.batas_akhir_menit_setelah_jadwal}m)`
        });
        showToast('Pengaturan aplikasi berhasil disimpan.', 'success');
      };

      if (IS_PREVIEW) {
        const btnReset = document.getElementById('btn-reset-demo-db');
        if (btnReset) {
          btnReset.onclick = () => {
            confirmDialog({
              title: 'Reset Data Preview',
              message: 'Seluruh data simulasi akan dikembalikan ke kondisi awal bawaan. Lanjutkan?',
              onConfirm: async () => {
                localStorage.removeItem(PREVIEW_STORAGE_KEY);
                await dbAdapter.getAll();
                showToast('Database simulasi berhasil direset.', 'success');
                renderAdminTabContent();
              }
            });
          };
        }
      }
    }

                    <td class="py-3 px-3"><span class="px-2 py-0.5 rounded-lg bg-[#F4F5FA] font-mono text-[11px] font-bold">${escapeHtml(log.aksi)}</span></td>
                    <td class="py-3 px-3 text-[#1E2029]">${escapeHtml(log.detail_perubahan)}</td>
                    <td class="py-3 px-3 text-[#5A607F]">${escapeHtml(log.alasan || '-')}</td>
                    <td class="py-3 pl-3 text-right text-[11px] text-[#9499B7]">${escapeHtml(log.device_info || '-')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 12. REAL-TIME LIVE CLOCK TICKER & INITIALIZATION
    // =========================================================================
    setInterval(() => {
      const jakarta = getJakartaNow();
      const pubClock = document.getElementById('public-live-clock');
      if (pubClock) pubClock.textContent = jakarta.timeFull;

      const admClock = document.getElementById('admin-live-clock');
      if (admClock) admClock.textContent = `${jakarta.formattedDate} • ${jakarta.timeFull} WIB`;
    }, 1000);

    async function bootstrapApp() {
      try {
        await dbAdapter.getAll();

        if (!IS_PREVIEW && fbAuth) {
          onAuthStateChanged(fbAuth, async (user) => {
            if (user) {
              state.adminUser = { uid: user.uid, email: user.email };
            } else {
              state.adminUser = null;
            }
            if (state.route === 'admin' && !state.adminUser) {
              state.route = 'public';
              renderPublicScreen();
            }
          });
        }

        state.route = 'public';
        renderPublicScreen();
      } catch (err) {
        console.error('Bootstrap error:', err);
        document.getElementById('app-root').innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md bg-white rounded-3xl p-6 shadow-bento text-center">
              <h2 class="text-lg font-extrabold text-rose-600 mb-2">Gagal Menghubungkan Database</h2>
              <p class="text-xs text-[#5A607F] leading-relaxed">${escapeHtml(err.message)}</p>
            </div>
          </div>
        `;
      }
    }

    bootstrapApp();
  </script>
</body>
</html>
