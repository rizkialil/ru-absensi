    function getJakartaNow() {
      const now = new Date();
      const formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      const parts = formatter.formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });

      const dateStr = `${map.year}-${map.month}-${map.day}`;
      const realHH = map.hour === '24' ? '00' : map.hour;
      const realMM = map.minute;
      const realSS = map.second;

      let activeHH = realHH;
      let activeMM = realMM;
      if (simulatedTimeHHMM) {
        const [sh, sm] = simulatedTimeHHMM.split(':');
        activeHH = sh;
        activeMM = sm;
      }

      // Hitung hari dalam minggu berdasarkan tanggal Jakarta
      const localDateObj = new Date(`${dateStr}T${activeHH}:${activeMM}:${realSS}+07:00`);
      const dayIndex = localDateObj.getUTCDay();
      // Koreksi ke WIB (+7)
      const wibDayIndex = new Date(localDateObj.getTime() + 7 * 3600 * 1000).getUTCDay();
      const hari = HARI_LIST[wibDayIndex];

      return {
        dateStr,
        hari,
        timeHHMM: `${activeHH}:${activeMM}`,
        timeFull: `${activeHH}:${activeMM}:${realSS}`,
        formattedDate: `${parseInt(map.day, 10)} ${BULAN_LIST[parseInt(map.month, 10) - 1]} ${map.year}`,
        isoTimestamp: localDateObj.toISOString(),
        isSimulated: Boolean(simulatedTimeHHMM)
      };
    }

    function timeToMinutes(hhmm) {
      if (!hhmm || !hhmm.includes(':')) return 0;
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(totalMins) {
      const clamped = Math.max(0, Math.min(23 * 60 + 59, totalMins));
      const h = String(Math.floor(clamped / 60)).padStart(2, '0');
      const m = String(clamped % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function generateRandomToken(prefix = 'RZQR') {
      const array = new Uint8Array(8);
      crypto.getRandomValues(array);
      const hex = Array.from(array, b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      return `${prefix}-${hex}`;

    function getDeviceSummary() {

      else if (/Windows/i.test(ua)) os = 'Windows';
      else if (/Mac/i.test(ua)) os = 'macOS';

      let browser = 'Browser';
      if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = 'Chrome';
      else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
      else if (/Firefox/i.test(ua)) browser = 'Firefox';
      else if (/Edg/i.test(ua)) browser = 'Edge';

      return `${os} • ${browser}`;

          getDocs(query(collection(fbDb, 'audit_logs'), orderBy('timestamp', 'desc'), limit(200)))
        ]);

        state.settings = sSnap.exists() ? sSnap.data() : getDefaultSettings();
        state.schoolYears = sySnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.subjects = subSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.classes = clsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.teachers = tSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.qrTokens = qrSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.schedules = schSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.attendanceRecords = attSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.auditLogs = logSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      },

      async syncPreview() {
        if (!IS_PREVIEW) return;
        savePreviewStore({
          settings: state.settings,
          schoolYears: state.schoolYears,
          subjects: state.subjects,
          classes: state.classes,
          teachers: state.teachers,
          qrTokens: state.qrTokens,
          schedules: state.schedules,
          attendanceRecords: state.attendanceRecords,
          auditLogs: state.auditLogs
        });
      },

      async setDocument(colName, docId, data) {
        if (IS_PREVIEW) {
          if (colName === 'attendance_settings') {
            state.settings = { ...data };
          } else {
            const arr = this._getStateArray(colName);
            const idx = arr.findIndex(x => x.id === docId);
            if (idx >= 0) arr[idx] = { id: docId, ...data };
            else arr.push({ id: docId, ...data });
          }
          await this.syncPreview();
          return docId;
        }
        await setDoc(doc(fbDb, colName, docId), data, { merge: true });
        await this.getAll();
        return docId;
      },

      async addDocument(colName, data) {
        if (IS_PREVIEW) {
          const newId = 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
          const arr = this._getStateArray(colName);
          arr.unshift({ id: newId, ...data });
          await this.syncPreview();
          return newId;
        }
        const ref = await addDoc(collection(fbDb, colName), data);
        await this.getAll();
        return ref.id;
      },

      async deleteDocument(colName, docId) {
        if (IS_PREVIEW) {
          const arr = this._getStateArray(colName);
          const idx = arr.findIndex(x => x.id === docId);
          if (idx >= 0) arr.splice(idx, 1);
          await this.syncPreview();
          return;
        }
        await deleteDoc(doc(fbDb, colName, docId));
        await this.getAll();
      },

      _getStateArray(colName) {
        const map = {
          school_years: state.schoolYears,
          subjects: state.subjects,
          classes: state.classes,
          teachers: state.teachers,
          qr_tokens: state.qrTokens,
          teaching_schedules: state.schedules,
          attendance_records: state.attendanceRecords,
          audit_logs: state.auditLogs
        };
        return map[colName];
      }
    };

    function getTodaySchedulesForTeacher(teacherId, hariName, kategori = null) {
      const activeYear = state.schoolYears.find(y => y.is_active);
      return state.schedules.filter(s => {
        const matchTeacher = s.teacher_id === teacherId;
        const matchDay = s.hari === hariName;
        const matchYear = activeYear ? s.school_year_id === activeYear.id : true;
        const matchKat = !kategori || kategori === 'all' || s.kategori === kategori;
        return matchTeacher && matchDay && matchYear && matchKat;
      }).sort((a, b) => timeToMinutes(a.jam_mulai) - timeToMinutes(b.jam_mulai));
    }

    function getFirstScheduleForTeacherOnDay(teacherId, hariName, kategori = null) {
      const list = getTodaySchedulesForTeacher(teacherId, hariName, kategori);
      return list.length > 0 ? list[0] : null;
    }

    /**
     * Evaluasi apakah guru yang belum absen pada jadwal tertentu sudah melewati batas akhir
     * untuk membedakan status "Belum Absen" vs "Tidak Hadir"
     */
    function evaluateMissingAttendanceStatus(schedule, targetDateStr) {
      const jakarta = getJakartaNow();
      const cfg = state.settings || getDefaultSettings();
      const startMins = timeToMinutes(schedule.jam_mulai);
      const deadlineMins = startMins + Number(cfg.batas_akhir_menit_setelah_jadwal || 45);

      if (targetDateStr < jakarta.dateStr) {
        return 'Tidak Hadir';
      }
      if (targetDateStr > jakarta.dateStr) {
        return 'Belum Absen';
      }
      const nowMins = timeToMinutes(jakarta.timeHHMM);
      return nowMins > deadlineMins ? 'Tidak Hadir' : 'Belum Absen';
    }

    /**
     * Proses Inti Absensi Multi-Peran (QR Code / Manual) dengan Transaksi Atomik
     * Mendukung KBM, Guru Piket, Tahfidz, Sorogan, OSIS, Ekskul, dan Jumat
     */
    async function processTeacherAttendance({ teacherId, qrToken = null, metode = 'MANUAL', scheduleId = null }) {
      if (!rateLimiter.check(15, 30000)) {
        throw new Error('Terlalu banyak percobaan dalam waktu singkat. Silakan tunggu beberapa detik.');
      }

      const jakarta = getJakartaNow();
      const cfg = state.settings || getDefaultSettings();

      // 1. Cek Hari Kerja
      if (!cfg.hari_kerja.includes(jakarta.hari)) {
        throw new Error(`Hari ${jakarta.hari} bukan merupakan hari kerja aktif pada konfigurasi sekolah.`);
      }

      // 2. Jika QR_CODE, validasi token terlebih dahulu
      let resolvedTeacherId = teacherId;
      if (metode === 'QR_CODE') {
        if (!qrToken && teacherId) {
          // Identitas guru telah terverifikasi pada tahap pemindaian awal (alur pemilihan multi-tugas)
          resolvedTeacherId = teacherId;
        } else {
          const cleanToken = String(qrToken || '').trim();
          const tokenObj = state.qrTokens.find(t => t.token === cleanToken || t.id === cleanToken);
          if (!tokenObj) {
            throw new Error('QR Code tidak dikenali oleh sistem. Pastikan Anda memindai kartu QR resmi.');
          }
          if (!tokenObj.is_active) {
            throw new Error('Token QR Code ini telah dinonaktifkan oleh Admin. Hubungi tata usaha/admin.');
          }
          resolvedTeacherId = tokenObj.teacher_id;
        }
      }

      // 3. Validasi Identitas & Status Aktif Guru
      const teacher = state.teachers.find(t => t.id === resolvedTeacherId);
      if (!teacher) {
        throw new Error('Data guru tidak ditemukan di dalam sistem.');
      }
      if (teacher.status !== 'aktif') {
        throw new Error(`Akun kepegawaian ${teacher.nama_lengkap} berstatus NONAKTIF. Silakan hubungi Admin.`);
      }

      // 4. Cari Semua Jadwal Tugas Guru pada Hari Ini
      const allTodaySchedules = getTodaySchedulesForTeacher(teacher.id, jakarta.hari);
      if (allTodaySchedules.length === 0) {
        throw new Error(`Tidak ditemukan jadwal KBM maupun tugas tambahan untuk ${teacher.nama_lengkap} pada hari ${jakarta.hari}.`);
      }

      // 5. Tentukan Jadwal Target atau Perlu Pemilihan Tugas (Multi-Role)
      let targetSchedule = null;
      if (scheduleId) {
        targetSchedule = allTodaySchedules.find(s => s.id === scheduleId);
        if (!targetSchedule) {
          throw new Error('Jadwal tugas yang dipilih tidak valid atau tidak ditemukan.');
        }
      } else {
        if (allTodaySchedules.length === 1) {
          targetSchedule = allTodaySchedules[0];
        } else {
          // Guru memiliki LEBIH DARI SATU tugas hari ini (misal: Tahfidz + KBM + Sorogan)
          // Kembalikan objek agar Terminal Publik menampilkan kartu pemilihan peran
          return {
            needDutySelection: true,
            teacher,
            metode,
            qrToken: qrToken || null,
            schedules: allTodaySchedules.map(sch => {
              const uId = `${teacher.id}_${sch.id}_${jakarta.dateStr}`;
              const rec = state.attendanceRecords.find(r => r.id === uId || (r.teacher_id === teacher.id && r.schedule_id === sch.id && r.tanggal === jakarta.dateStr));
              return {
                ...sch,
                isAttended: Boolean(rec),
                attendedRecord: rec || null
              };
            })
          };
        }
      }

      // 6. Validasi Waktu Absensi Berdasarkan Jadwal Tugas Target & Kebijakan Toleransi
      const schedStartMins = timeToMinutes(targetSchedule.jam_mulai);
      const openMins = schedStartMins - Number(cfg.menit_buka_sebelum_jadwal || 15);
      const toleranceMins = Number(cfg.toleransi_terlambat_menit || 15);
      const modeToleransi = cfg.mode_toleransi || 'DISPENSASI_HADIR'; // 'DISPENSASI_HADIR' | 'KETAT_TERLAMBAT'

      // Jika mode DISPENSASI_HADIR: rentang jam masuk s.d. (jadwal + toleransi) dihitung HADIR
      const onTimeDeadlineMins = modeToleransi === 'DISPENSASI_HADIR'
        ? (schedStartMins + toleranceMins)
        : schedStartMins;
      const lateDeadlineMins = schedStartMins + Number(cfg.batas_akhir_menit_setelah_jadwal || 45);
      const nowMins = timeToMinutes(jakarta.timeHHMM);

      const katInfo = getKategoriInfo(targetSchedule.kategori || 'KBM_REGULER');
      const sub = state.subjects.find(s => s.id === targetSchedule.subject_id);
      const cls = state.classes.find(c => c.id === targetSchedule.class_id);
      const taskTitle = targetSchedule.nama_tugas || (sub ? sub.nama_mapel : katInfo.label);

      if (nowMins < openMins) {
        throw new Error(
          `Absensi [${katInfo.label}: ${taskTitle}] belum dibuka. Jadwal tugas pukul ${targetSchedule.jam_mulai} WIB (Absensi dibuka mulai ${minutesToTime(openMins)} WIB).`
        );
      }

      let finalStatus = 'Hadir';
      let menitTerlambat = 0;
      let isDispensasi = false;

      if (nowMins <= onTimeDeadlineMins) {
        finalStatus = 'Hadir';
        menitTerlambat = 0;
        if (nowMins > schedStartMins) {
          isDispensasi = true;
        }
      } else if (nowMins <= lateDeadlineMins) {
        finalStatus = 'Terlambat';
        menitTerlambat = nowMins - schedStartMins;
      } else {
        if (cfg.kebijakan_lewat_batas === 'TIDAK_HADIR') {
          finalStatus = 'Tidak Hadir';
          menitTerlambat = nowMins - schedStartMins;
        } else {
          throw new Error(
            `Batas waktu absensi [${katInfo.label}: ${taskTitle}] telah berakhir pada pukul ${minutesToTime(lateDeadlineMins)} WIB (Jadwal ${targetSchedule.jam_mulai} WIB). Silakan hubungi Admin.`
          );
        }
      }

      // 7. Simpan Absensi Secara Atomik per Tugas per Hari ({teacher_id}_{schedule_id}_{YYYY-MM-DD})
      const uniqueRecordId = `${teacher.id}_${targetSchedule.id}_${jakarta.dateStr}`;
      const recordPayload = {
        teacher_id: teacher.id,
        schedule_id: targetSchedule.id,
        kategori: targetSchedule.kategori || 'KBM_REGULER',
        nama_tugas: taskTitle,
        lokasi: targetSchedule.lokasi || (cls ? cls.nama_kelas : '-'),
        tanggal: jakarta.dateStr,
        hari: jakarta.hari,
        jadwal_jam_mulai: targetSchedule.jam_mulai,
        jadwal_jam_selesai: targetSchedule.jam_selesai,
        subject_id: targetSchedule.subject_id || '',
        class_id: targetSchedule.class_id || '',
        waktu_absensi: jakarta.timeFull,
        status: finalStatus,
        menit_terlambat: menitTerlambat,
        is_dispensasi: isDispensasi,
        metode: metode,
        device_info: getDeviceSummary(),
        catatan_koreksi: finalStatus === 'Tidak Hadir' ? 'Otomatis ditandai Tidak Hadir (melewati batas waktu absensi)' : (isDispensasi ? `Hadir dalam masa toleransi dispensasi (+${nowMins - schedStartMins} mnt)` : '')
      };

      if (IS_PREVIEW) {
        const existing = state.attendanceRecords.find(
          r => r.id === uniqueRecordId || (r.teacher_id === teacher.id && r.schedule_id === targetSchedule.id && r.tanggal === jakarta.dateStr)
        );
        if (existing) {
          throw new Error(
            `${teacher.nama_lengkap} sudah tercatat absensi [${katInfo.label}: ${taskTitle}] hari ini pada pukul ${existing.waktu_absensi} WIB (Status: ${existing.status}).`
          );
        }
        state.attendanceRecords.unshift({ id: uniqueRecordId, ...recordPayload });
        await dbAdapter.syncPreview();
      } else {
        const recRef = doc(fbDb, 'attendance_records', uniqueRecordId);
        await runTransaction(fbDb, async (transaction) => {
          const docSnap = await transaction.get(recRef);
          if (docSnap.exists()) {
            const existing = docSnap.data();
            throw new Error(
              `${teacher.nama_lengkap} sudah tercatat absensi [${katInfo.label}: ${taskTitle}] hari ini pada pukul ${existing.waktu_absensi} WIB (Status: ${existing.status}).`
            );
          }
          transaction.set(recRef, recordPayload);
        });
        await dbAdapter.getAll();
      }

      return {
        teacher,
        schedule: targetSchedule,
        kategori: targetSchedule.kategori || 'KBM_REGULER',
        katInfo,
        taskTitle,
        subjectName: taskTitle,
        className: targetSchedule.lokasi || (cls ? cls.nama_kelas : '-'),
        tanggal: jakarta.formattedDate,
        waktu: jakarta.timeFull,
        status: finalStatus,
        menit_terlambat: menitTerlambat,
        isDispensasi,
        metode: metode === 'QR_CODE' ? 'QR Code' : 'Absensi Manual'
      };
    }

    // Audio Chime Synthesizer via Web Audio API (Zero External Assets)
    function playAudioChime(type = 'success') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;
        if (type === 'success') {
          // Melodious two-tone ascending chime (D5 -> A5)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now); // D5
          gain1.gain.setValueAtTime(0.12, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.35);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.12); // A5
          gain2.gain.setValueAtTime(0.16, now + 0.12);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.12);
          osc2.stop(now + 0.55);
        } else if (type === 'warning') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now); // A4
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'error') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now); // A3
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        // Fallback silently if audio context is unavailable
      }
    }

    async function startQrCameraScanner() {
      const statusBanner = document.getElementById('qr-status-banner');
      try {
        await stopQrScannerIfRunning();
        if (!window.Html5Qrcode) {
          if (statusBanner) statusBanner.textContent = 'Library scanner belum siap. Gunakan input token di bawah.';
          return;
        }
        const html5Qr = new Html5Qrcode('qr-reader-viewport');
        state.html5QrInstance = html5Qr;

        await html5Qr.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          async (decodedText) => {
            await handleQrScannedSuccess(decodedText);
          },
          () => {}
        );

        if (statusBanner) {
          statusBanner.className = 'mt-3 p-3 rounded-xl bg-emerald-50 text-xs font-semibold text-emerald-700 text-center';
          statusBanner.textContent = 'Kamera aktif. Silakan arahkan QR Code guru ke dalam kotak pemindai.';
        }
      } catch (err) {
        if (statusBanner) {
          statusBanner.className = 'mt-3 p-3 rounded-xl bg-amber-50 text-xs font-medium text-amber-700 text-center';
          statusBanner.textContent = 'Kamera tidak tersedia/diizinkan di perangkat ini. Gunakan kolom input token QR di bawah.';
        }
      }
    }

    let qrScanLock = false;
    async function handleQrScannedSuccess(tokenStr) {
      if (qrScanLock) return;
      qrScanLock = true;
      try {
        await stopQrScannerIfRunning();
        const result = await processTeacherAttendance({
          qrToken: tokenStr,
          metode: 'QR_CODE'
        });
        if (result?.needDutySelection) {
          state.publicMode = 'select_duty';
          state.pendingDutySelection = result;
          renderPublicBodyArea();
        } else if (result) {
          showAttendanceResultCard(result);
        }
      } catch (err) {
        playAudioChime('error');
        showToast(err.message, 'error');
        state.publicMode = 'idle';
        renderPublicBodyArea();
      } finally {
        setTimeout(() => { qrScanLock = false; }, 1200);
      }
    }

    function showAttendanceResultCard(result) {
      clearPublicCountdown();
      const cfg = state.settings || getDefaultSettings();
      state.publicResult = result;
      state.publicMode = 'result';
      state.publicCountdown = Number(cfg.jeda_reset_publik_detik || 8);
      renderPublicBodyArea();

      const isLate = result.status === 'Terlambat';
      const isAbsent = result.status === 'Tidak Hadir';
      const isDispensasi = Boolean(result.isDispensasi);
      playAudioChime(isAbsent ? 'error' : (isLate || isDispensasi) ? 'warning' : 'success');
      const toastType = isAbsent ? 'error' : isLate ? 'warning' : 'success';
      const toastMsg = isLate && result.menit_terlambat > 0
        ? `Absensi ${result.teacher.nama_lengkap} tercatat Terlambat (+${result.menit_terlambat} mnt).`
        : isDispensasi
          ? `Absensi ${result.teacher.nama_lengkap} tercatat Hadir (Masa Toleransi Dispensasi).`
          : `Absensi ${result.teacher.nama_lengkap} berhasil tercatat (${result.status}).`;
      showToast(toastMsg, toastType);

      state.publicCountdownTimer = setInterval(() => {
        state.publicCountdown -= 1;
        const numEl = document.getElementById('reset-countdown-num');
        if (numEl) numEl.textContent = state.publicCountdown;
        if (state.publicCountdown <= 0) {
          clearPublicCountdown();
          state.publicMode = 'idle';
          state.publicResult = null;
          if (state.route === 'public') {
            renderPublicBodyArea();
          }
        }
      }, 1000);
    }

    // -------------------------------------------------------------------------
    // MODUL 1: DASHBOARD ADMIN (Bento Grid + 4 Kartu Pastel + Kalender + Grafik)
    // -------------------------------------------------------------------------
    function computeDailySummary(dateStr, filterKategori = null) {
      const activeKategori = filterKategori || state.dashboardFilterKategori || 'all';
      const dObj = new Date(`${dateStr}T08:00:00+07:00`);
      const wibDayIdx = new Date(dObj.getTime() + 7 * 3600 * 1000).getUTCDay();
      const hariName = HARI_LIST[wibDayIdx];
      const activeYear = state.schoolYears.find(y => y.is_active);

      const activeTeachers = state.teachers.filter(t => t.status === 'aktif');

      // Ambil seluruh jadwal yang aktif di hari ini sesuai filter kategori
      const relevantSchedules = state.schedules.filter(s => {
        const matchDay = s.hari === hariName;
        const matchYear = activeYear ? s.school_year_id === activeYear.id : true;
        const matchKat = activeKategori === 'all' || (s.kategori || 'KBM_REGULER') === activeKategori;
        return matchDay && matchYear && matchKat;
      }).sort((a, b) => timeToMinutes(a.jam_mulai) - timeToMinutes(b.jam_mulai));

      let scheduledCount = 0;
      let hadirCount = 0;
      let terlambatCount = 0;
      let belumAbsenCount = 0;
      let tidakHadirCount = 0;
      let izinSakitCount = 0;

      const detailedRows = [];

      relevantSchedules.forEach(sched => {
        const t = activeTeachers.find(x => x.id === sched.teacher_id);
        if (!t) return;
        scheduledCount++;

        const kInfo = getKategoriInfo(sched.kategori || 'KBM_REGULER');
        const sub = state.subjects.find(s => s.id === sched.subject_id);
        const cls = state.classes.find(c => c.id === sched.class_id);
        const title = sched.nama_tugas || (sub ? sub.nama_mapel : kInfo.label);
        const loc = sched.lokasi || (cls ? cls.nama_kelas : '-');

        const rec = state.attendanceRecords.find(
          r => r.teacher_id === t.id && r.schedule_id === sched.id && r.tanggal === dateStr
        );

        if (rec) {
          if (rec.status === 'Hadir') hadirCount++;
          else if (rec.status === 'Terlambat') terlambatCount++;
          else if (rec.status === 'Tidak Hadir') tidakHadirCount++;
          else if (rec.status === 'Izin' || rec.status === 'Sakit') izinSakitCount++;

          detailedRows.push({
            teacher: t,
            schedule: sched,
            kategori: sched.kategori || 'KBM_REGULER',
            katInfo: kInfo,
            judulTugas: title,
            lokasi: loc,
            jamJadwal: `${sched.jam_mulai}–${sched.jam_selesai}`,
            waktuAbsen: rec.waktu_absensi,
            status: rec.status,
            metode: rec.metode,
            menitTerlambat: rec.menit_terlambat || 0,
            isDispensasi: Boolean(rec.is_dispensasi)
          });
        } else {
          const missingStatus = evaluateMissingAttendanceStatus(sched, dateStr);
          if (missingStatus === 'Tidak Hadir') tidakHadirCount++;
          else belumAbsenCount++;

          detailedRows.push({
            teacher: t,
            schedule: sched,
            kategori: sched.kategori || 'KBM_REGULER',
            katInfo: kInfo,
            judulTugas: title,
            lokasi: loc,
            jamJadwal: `${sched.jam_mulai}–${sched.jam_selesai}`,
            waktuAbsen: '-',
            status: missingStatus,
            metode: '-',
            menitTerlambat: 0,
            isDispensasi: false
          });
        }
      });

      const presentTotal = hadirCount + terlambatCount;
      const percentage = scheduledCount > 0 ? Math.round((presentTotal / scheduledCount) * 100) : 0;

      return {
        dateStr,
        hariName,
        totalActiveTeachers: activeTeachers.length,
        scheduledCount,
        hadirCount,
        terlambatCount,
        belumAbsenCount,
        tidakHadirCount,
        izinSakitCount,
        percentage,
        detailedRows
      };
    }

      if (status === 'Terlambat') {
        const extra = menitTerlambat > 0 ? ` (+${menitTerlambat}m)` : '';
        return `<span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-700">Terlambat${extra}</span>`;
      }
      const map = {
        'Hadir': 'bg-emerald-100 text-emerald-700',
        'Tidak Hadir': 'bg-rose-100 text-rose-700',
        'Izin': 'bg-indigo-100 text-indigo-700',
        'Sakit': 'bg-sky-100 text-sky-700',
        'Belum Absen': 'bg-slate-100 text-slate-600'

      return `<span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-bold ${map[status] || 'bg-slate-100 text-slate-600'}">${escapeHtml(status)}</span>`;
    }

    function renderInteractiveCalendar() {
      const y = state.dashboardCalendarYear;
      const m = state.dashboardCalendarMonth;
      const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
      const offset = firstDay === 0 ? 6 : firstDay - 1; // Mon=0
      const daysInMonth = new Date(y, m + 1, 0).getDate();

      let cells = '';
      for (let i = 0; i < offset; i++) {
        cells += `<div></div>`;
      }
      const nowJakarta = getJakartaNow();
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isSelected = state.dashboardDate === ds;
        const isToday = nowJakarta.dateStr === ds;
        cells += `
          <button data-date="${ds}" class="cal-day-btn w-8 h-8 mx-auto rounded-full text-xs font-bold tabular-nums flex items-center justify-center transition cursor-pointer active:scale-90 ${
            isSelected
              ? 'bg-[#6C5CE7] text-white shadow-sm ring-2 ring-[#6C5CE7]/30'
              : isToday
                ? 'border-2 border-[#6C5CE7] text-[#6C5CE7] hover:bg-[#EFEFFD]'
                : 'text-[#5A607F] hover:bg-[#EFEFFD] hover:text-[#6C5CE7]'
          }" title="${ds}">${d}</button>
        `;
      }

      return `
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-[#1E2029]">${BULAN_LIST[m]} ${y}</h3>
            <div class="flex items-center gap-1">
              <button id="cal-prev-month" aria-label="Bulan Sebelumnya" class="p-1.5 rounded-lg hover:bg-[#F4F5FA] text-[#5A607F] cursor-pointer"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
              <button id="cal-next-month" aria-label="Bulan Berikutnya" class="p-1.5 rounded-lg hover:bg-[#F4F5FA] text-[#5A607F] cursor-pointer"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>

          <div class="grid grid-cols-7 text-center text-[10px] font-bold text-[#9499B7] mb-2">
            <span>Sn</span><span>Sl</span><span>Rb</span><span>Km</span><span>Jm</span><span>Sb</span><span>Mg</span>
          </div>
          <div class="grid grid-cols-7 gap-y-1 text-center">
            ${cells}
          </div>
        </div>
      `;
    }

    function renderWeeklySvgChart(days) {
      const maxVal = Math.max(5, ...days.map(d => d.count));
      const width = 300;
      const height = 115;
      const pts = days.map((d, idx) => {
        const x = 20 + (idx * (width - 40)) / (days.length - 1);
        const y = height - 26 - ((d.count / maxVal) * (height - 48));
        return { x, y, ...d };
      });
      const pathD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      const areaD = `${pathD} L ${pts[pts.length - 1].x.toFixed(1)} ${height - 20} L ${pts[0].x.toFixed(1)} ${height - 20} Z`;

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-32 overflow-visible">
          <defs>
            <linearGradient id="purpleArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#purpleArea)" />
          <path d="${pathD}" fill="none" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          ${pts.map(p => `
            <g class="cursor-pointer group">
              <circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="2" class="transition-all duration-200" />
              <text x="${p.x}" y="${Math.max(12, p.y - 7)}" text-anchor="middle" font-size="9" fill="#6C5CE7" font-weight="800">${p.count}</text>
              <text x="${p.x}" y="${height - 4}" text-anchor="middle" font-size="9" fill="#9499B7" font-weight="600">${p.shortDay}</text>
            </g>
          `).join('')}
        </svg>
      `;
    }

    function renderStatusDonutChart(summary) {
      const total = Math.max(1, summary.hadirCount + summary.terlambatCount + summary.tidakHadirCount + summary.izinSakitCount);
      const items = [
        { label: 'Hadir', count: summary.hadirCount, color: '#34D399' },
        { label: 'Terlambat', count: summary.terlambatCount, color: '#F59E0B' },
        { label: 'Tidak Hadir', count: summary.tidakHadirCount, color: '#F43F5E' },
        { label: 'Izin / Sakit', count: summary.izinSakitCount, color: '#6C5CE7' }
      ];

      let acc = 0;
      const radius = 36;
      const circumference = 2 * Math.PI * radius;

      const circles = items.map(it => {
        const pct = it.count / total;
        const dash = pct * circumference;
        const offset = -acc * circumference;
        acc += pct;
        if (it.count === 0) return '';
        return `<circle cx="48" cy="48" r="${radius}" fill="transparent" stroke="${it.color}" stroke-width="11" stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" />`;
      }).join('');

      return `
        <div class="flex items-center gap-4">
          <div class="relative w-28 h-28 shrink-0 flex items-center justify-center">
            <svg viewBox="0 0 96 96" class="w-full h-full -rotate-90">
              <circle cx="48" cy="48" r="${radius}" fill="transparent" stroke="#F4F5FA" stroke-width="11" />
              ${circles}
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
              <span class="text-xs font-extrabold text-[#1E2029] tabular-nums leading-none">${summary.percentage}%</span>
              <span class="text-[9px] font-bold text-[#9499B7] mt-0.5">Kehadiran</span>
            </div>
          </div>
          <div class="flex-1 space-y-2">
            ${items.map(it => `
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${it.color}"></span>
                  <span class="text-[#5A607F] font-medium">${it.label}</span>
                </div>
                <span class="font-bold text-[#1E2029] tabular-nums">${it.count}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

                          <p class="text-[11px] text-[#9499B7] truncate max-w-[180px]">${escapeHtml(t.alamat || '-')}</p>
                        </td>
                        <td class="py-3 px-3">
                          <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${t.status === 'aktif' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${t.status === 'aktif' ? 'Aktif' : 'Nonaktif'}
                          </span>
                        </td>
                        <td class="py-3 pl-3 text-right">
                          <div class="inline-flex items-center gap-1">
                            <button data-qr-tid="${t.id}" title="Lihat & Cetak Kartu QR" class="btn-view-qr p-2 rounded-xl bg-[#EFEFFD] text-[#6C5CE7] hover:bg-[#6C5CE7] hover:text-white transition">
                              <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
                            </button>
                            <button data-edit-tid="${t.id}" title="Edit Guru" class="btn-edit-teacher p-2 rounded-xl bg-[#F4F5FA] text-[#5A607F] hover:text-[#1E2029] transition">
                              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                            </button>
                            <button data-del-tid="${t.id}" title="Hapus Guru" class="btn-del-teacher p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition">
                              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    `).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.querySelectorAll('.t-status-tab').forEach(btn => {
        btn.onclick = () => {
          state.teacherFilterStatus = btn.dataset.tstatus;
          renderAdminTabContent();
        };
      });

      document.getElementById('btn-add-teacher').onclick = () => openTeacherFormModal(null);
      const btnEmptyTeacher = document.getElementById('btn-empty-add-teacher');
      if (btnEmptyTeacher) btnEmptyTeacher.onclick = () => openTeacherFormModal(null);
      document.getElementById('btn-teacher-import-excel').onclick = () => openTeacherExcelImportModal();
      document.getElementById('btn-teacher-export-excel').onclick = () => exportTeachersToExcel();
      document.getElementById('btn-print-all-qr').onclick = () => printTeacherQrCards(state.teachers.filter(t => t.status === 'aktif'));

      document.querySelectorAll('.btn-view-qr').forEach(btn => {
        btn.onclick = () => {
          const t = state.teachers.find(x => x.id === btn.dataset.qrTid);
          if (t) openSingleQrCardModal(t);
        };
      });

      document.querySelectorAll('.btn-edit-teacher').forEach(btn => {
        btn.onclick = () => {
          const t = state.teachers.find(x => x.id === btn.dataset.editTid);
          if (t) openTeacherFormModal(t);
        };
      });

      document.querySelectorAll('.btn-del-teacher').forEach(btn => {
        btn.onclick = () => {
          const t = state.teachers.find(x => x.id === btn.dataset.delTid);
          if (!t) return;
          confirmDialog({
            title: 'Hapus Data Guru',
            message: `Hapus guru "${t.nama_lengkap}" (${t.kode_guru})? Data jadwal dan token QR terkait juga akan terpengaruh.`,
            onConfirm: async () => {
              await dbAdapter.deleteDocument('teachers', t.id);
              await recordAuditLog({
                aksi: 'DELETE_TEACHER',
                entitas: 'teachers',
                target_id: t.id,
                detail_perubahan: `Menghapus guru ${t.nama_lengkap} (${t.kode_guru})`
              });
              showToast('Data guru berhasil dihapus.', 'success');
              renderAdminTabContent();
            }
          });
        };
      });
    }

    function openTeacherFormModal(teacher = null) {
      const isEdit = Boolean(teacher);
      openModal(`
        <div class="p-6">
          <div class="flex items-center justify-between mb-5">

            <button onclick="document.getElementById('modal-backdrop').classList.add('hidden')" class="p-2 rounded-xl bg-[#F4F5FA] text-[#5A607F]"><i data-lucide="x" class="w-4 h-4"></i></button>

          <form id="form-teacher" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Kode Guru (Unik) *</label>
                <input id="f-kode-guru" type="text" required value="${escapeHtml(teacher?.kode_guru || `GR-${String(state.teachers.length + 1).padStart(3, '0')}`)}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold focus:bg-white focus:border-[#6C5CE7] border border-transparent focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">NIP / NUPTK (Opsional)</label>

              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-[#5A607F] mb-1">Nama Lengkap & Gelar *</label>
              <input id="f-nama" type="text" required value="${escapeHtml(teacher?.nama_lengkap || '')}" placeholder="Contoh: Drs. Ahmad Fauzi, M.Pd." class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-medium focus:bg-white focus:border-[#6C5CE7] border border-transparent focus:outline-none" />

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Jenis Kelamin *</label>
                <select id="f-jk" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-semibold focus:outline-none">

                  <option value="P" ${teacher?.jenis_kelamin === 'P' ? 'selected' : ''}>Perempuan (P)</option>

              </div>
              <div>
                <label class="block text-xs font-bold text-[#5A607F] mb-1">Status Kepegawaian *</label>

                  <option value="nonaktif" ${teacher?.status === 'nonaktif' ? 'selected' : ''}>Nonaktif</option>

            </div>
            <div>
              <label class="block text-xs font-bold text-[#5A607F] mb-1">Nomor HP (Opsional)</label>
              <input id="f-hp" type="text" value="${escapeHtml(teacher?.no_hp || '')}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-medium focus:bg-white focus:border-[#6C5CE7] border border-transparent focus:outline-none" />

              <label class="block text-xs font-bold text-[#5A607F] mb-1">Alamat (Opsional)</label>
              <textarea id="f-alamat" rows="2" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-medium focus:bg-white focus:border-[#6C5CE7] border border-transparent focus:outline-none">${escapeHtml(teacher?.alamat || '')}</textarea>
            </div>

              <button type="button" onclick="document.getElementById('modal-backdrop').classList.add('hidden')" class="px-4 py-2.5 rounded-xl bg-[#F4F5FA] text-xs font-bold text-[#5A607F]">Batal</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#6C5CE7] hover:bg-[#5A4BD1] text-white text-xs font-bold">Simpan Data Guru</button>

      document.getElementById('form-teacher').onsubmit = async (e) => {

        const nama_lengkap = document.getElementById('f-nama').value.trim();

        const no_hp = document.getElementById('f-hp').value.trim();
        const alamat = document.getElementById('f-alamat').value.trim();

        const dup = state.teachers.find(x => x.kode_guru.toUpperCase() === kode_guru && x.id !== teacher?.id);

          showToast(`Kode Guru "${kode_guru}" sudah digunakan oleh ${dup.nama_lengkap}.`, 'error');

        const jakarta = getJakartaNow();

          await dbAdapter.setDocument('teachers', teacher.id, {

            kode_guru,

            nama_lengkap,
            jenis_kelamin,
            status,
            no_hp,
            alamat,
            updated_at: jakarta.isoTimestamp

            aksi: 'UPDATE_TEACHER',
            entitas: 'teachers',

            detail_perubahan: `Memperbarui data guru ${nama_lengkap} (${kode_guru})`

          showToast('Data guru berhasil diperbarui.', 'success');

            kode_guru,
            nip_nuptk,
            nama_lengkap,
            jenis_kelamin,
            status,
            no_hp,
            alamat,
            foto_url: '',
            created_at: jakarta.isoTimestamp
          });
          // Otomatis buatkan Token QR Unik untuk guru baru
          const token = generateRandomToken();
          await dbAdapter.setDocument('qr_tokens', token, {
            token,
            teacher_id: newTeacherId,
            is_active: true,
            created_at: jakarta.isoTimestamp
          });
          await recordAuditLog({
            aksi: 'CREATE_TEACHER',
            entitas: 'teachers',
            target_id: newTeacherId,
            detail_perubahan: `Menambahkan guru baru ${nama_lengkap} (${kode_guru}) + Token QR`
          });
          showToast('Guru baru & Token QR berhasil dibuat.', 'success');
        }
        closeModal();
        renderAdminTabContent();
      };
    }

      let tokenObj = state.qrTokens.find(q => q.teacher_id === teacher.id && q.is_active);
      if (!tokenObj) tokenObj = state.qrTokens.find(q => q.teacher_id === teacher.id);

      openModal(`
        <div class="p-6 text-center">
          <div class="flex items-center justify-between mb-4">

          </div>

          <div class="max-w-xs mx-auto bg-gradient-to-b from-[#EFEFFD] to-white rounded-3xl p-6 border-2 border-[#6C5CE7]/20 shadow-bento">

            <p class="text-[10px] text-[#9499B7] mb-4">KARTU ABSENSI GURU</p>

          <div class="mt-5 flex justify-center gap-2.5">
            <button id="btn-print-single-qr" class="px-5 py-2.5 rounded-xl bg-[#6C5CE7] hover:bg-[#5A4BD1] text-white text-xs font-bold inline-flex items-center gap-2">

    function printTeacherQrCards(teacherList) {
      const cfg = state.settings || getDefaultSettings();
      const printArea = document.getElementById('print-area');
      printArea.classList.remove('hidden');

      printArea.innerHTML = `
        <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
          <h2 style="font-size: 16px; font-weight: 800; margin-bottom: 12px;">Kartu QR Code Absensi Guru — ${escapeHtml(cfg.nama_instansi)}</h2>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
            ${teacherList.map(t => {
              const tok = state.qrTokens.find(q => q.teacher_id === t.id && q.is_active) || state.qrTokens.find(q => q.teacher_id === t.id);
              return `
                <div style="border: 1.5px solid #6C5CE7; border-radius: 16px; padding: 14px; text-align: center; page-break-inside: avoid;">
                  <div style="font-size: 10px; font-weight: 800; color: #6C5CE7; text-transform: uppercase;">${escapeHtml(cfg.nama_instansi)}</div>
                  <div id="print-qr-${t.id}" style="width: 110px; height: 110px; margin: 10px auto;"></div>
                  <div style="font-size: 12px; font-weight: 800; color: #1E2029;">${escapeHtml(t.nama_lengkap)}</div>
                  <div style="font-size: 11px; font-weight: 700; color: #6C5CE7;">${escapeHtml(t.kode_guru)}</div>
                  <div style="font-size: 9px; color: #9499B7; margin-top: 2px;">${escapeHtml(tok ? tok.token : '-')}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      if (window.QRCode) {
        teacherList.forEach(t => {
          const tok = state.qrTokens.find(q => q.teacher_id === t.id && q.is_active) || state.qrTokens.find(q => q.teacher_id === t.id);
          const el = document.getElementById(`print-qr-${t.id}`);
          if (el && tok) {
            new QRCode(el, { text: tok.token, width: 110, height: 110 });
          }
        });
      }

      setTimeout(() => {
        window.print();
        printArea.classList.add('hidden');
      }, 450);
    }

    function exportTeachersToExcel() {
      if (!window.XLSX) {
        showToast('Library Excel belum siap.', 'error');
        return;
      }
      const rows = state.teachers.map(t => ({
        'Kode Guru': t.kode_guru,
        'NIP/NUPTK': t.nip_nuptk || '',
        'Nama Lengkap': t.nama_lengkap,
        'Jenis Kelamin (L/P)': t.jenis_kelamin,
        'Nomor HP': t.no_hp || '',
        'Alamat': t.alamat || '',
        'Status (aktif/nonaktif)': t.status
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data Guru');
      XLSX.writeFile(wb, `Data_Guru_RzAbsensi_${getJakartaNow().dateStr}.xlsx`);
      showToast('Data guru berhasil diekspor ke Excel.', 'success');
    }

    function openTeacherExcelImportModal() {
      let validatedRows = [];

      openModal(`
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-lg font-extrabold text-[#1E2029]">Impor Data Guru (Excel)</h3>
            </div>
            <button onclick="document.getElementById('modal-backdrop').classList.add('hidden')" class="p-2 rounded-xl bg-[#F4F5FA] text-[#5A607F]"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <div class="p-4 rounded-2xl bg-[#EFEFFD] flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="text-xs text-[#5A607F]">
              <p class="font-bold text-[#1E2029]">Template Excel Guru</p>
              <p>Format kolom: kode_guru, nip_nuptk, nama_lengkap, jenis_kelamin, no_hp, status</p>
            </div>
            <button id="btn-dl-teacher-template" class="px-3.5 py-2 rounded-xl bg-white text-[#6C5CE7] text-xs font-bold shadow-sm hover:bg-[#6C5CE7] hover:text-white transition">
              Download Template
            </button>
          </div>

          <div class="mb-4">
            <label class="block text-xs font-bold text-[#5A607F] mb-1.5">Pilih File Excel (.xlsx / .xls)</label>
            <input id="input-teacher-excel-file" type="file" accept=".xlsx,.xls" class="w-full text-xs text-[#5A607F] file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#6C5CE7] file:text-white hover:file:bg-[#5A4BD1]" />
          </div>

          <div id="teacher-import-preview-area" class="space-y-3"></div>
        </div>
      `, 'max-w-3xl');

      document.getElementById('btn-dl-teacher-template').onclick = () => {
        const sample = [
          {
            kode_guru: 'GR-006',
            nip_nuptk: '199105102019032001',
            nama_lengkap: 'Dewi Lestari, S.Pd.',
            jenis_kelamin: 'P',
            no_hp: '081299887766',
            alamat: 'Jl. Merdeka No. 10',
            status: 'aktif'
          }
        ];
        const ws = XLSX.utils.json_to_sheet(sample);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Template_Guru');
        XLSX.writeFile(wb, 'Template_Impor_Guru_RzAbsensi.xlsx');
      };

      document.getElementById('input-teacher-excel-file').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const wb = XLSX.read(evt.target.result, { type: 'binary' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rawJson = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            const previewArea = document.getElementById('teacher-import-preview-area');

            if (rawJson.length === 0) {
              previewArea.innerHTML = `<p class="text-xs text-rose-600 font-bold">File Excel kosong.</p>`;
              return;
            }

            // Validasi Struktur Kolom
            const firstKeys = Object.keys(rawJson[0]).map(k => k.trim().toLowerCase());
            if (!firstKeys.includes('kode_guru') || !firstKeys.includes('nama_lengkap')) {
              previewArea.innerHTML = `<div class="p-3 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold">Struktur kolom tidak sesuai! Wajib memiliki kolom: <code>kode_guru</code> dan <code>nama_lengkap</code>.</div>`;
              return;
            }

            const seenCodes = new Set(state.teachers.map(t => t.kode_guru.toUpperCase()));
            validatedRows = rawJson.map((row, idx) => {
              const kode = String(row.kode_guru || '').trim().toUpperCase();
              const nama = String(row.nama_lengkap || '').trim();
              const jk = String(row.jenis_kelamin || 'L').trim().toUpperCase() === 'P' ? 'P' : 'L';
              const nip = String(row.nip_nuptk || '').trim();
              const hp = String(row.no_hp || '').trim();
              const alamat = String(row.alamat || '').trim();
              const status = String(row.status || 'aktif').trim().toLowerCase() === 'nonaktif' ? 'nonaktif' : 'aktif';

              let error = '';
              if (!kode || !nama) error = 'Kode Guru & Nama wajib diisi';
              else if (seenCodes.has(kode)) error = `Duplikasi Kode Guru (${kode})`;
              else seenCodes.add(kode);

              return { rowNum: idx + 2, kode, nama, jk, nip, hp, alamat, status, valid: !error, error };
            });

            const validCount = validatedRows.filter(r => r.valid).length;
            const invalidCount = validatedRows.length - validCount;

            previewArea.innerHTML = `
              <div class="flex items-center justify-between text-xs font-bold">
                <span>Pratinjau Data (${validatedRows.length} baris)</span>
                <div class="flex gap-2">
                  <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700">Valid: ${validCount}</span>
                  <span class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-700">Gagal/Duplikat: ${invalidCount}</span>
                </div>
              </div>
              <div class="max-h-56 overflow-y-auto border border-[#F0F1F7] rounded-2xl">
                <table class="w-full text-left text-xs">
                  <thead class="bg-[#F4F5FA] text-[11px] font-bold text-[#9499B7]">
                    <tr>
                      <th class="p-2.5">Baris</th>
                      <th class="p-2.5">Kode</th>
                      <th class="p-2.5">Nama Lengkap</th>
                      <th class="p-2.5">L/P</th>
                      <th class="p-2.5">Validasi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[#F0F1F7]">
                    ${validatedRows.map(r => `
                      <tr>
                        <td class="p-2.5">${r.rowNum}</td>
                        <td class="p-2.5 font-bold">${escapeHtml(r.kode)}</td>
                        <td class="p-2.5">${escapeHtml(r.nama)}</td>
                        <td class="p-2.5">${r.jk}</td>
                        <td class="p-2.5">${r.valid ? '<span class="text-emerald-600 font-bold">Siap Impor</span>' : `<span class="text-rose-600 font-bold">${escapeHtml(r.error)}</span>`}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button id="btn-confirm-teacher-import" ${validCount === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl bg-[#6C5CE7] disabled:bg-[#D5D7E8] text-white text-xs font-bold">
                  Konfirmasi Impor (${validCount} Guru Valid)
                </button>
              </div>
            `;

            const btnConfirm = document.getElementById('btn-confirm-teacher-import');
            if (btnConfirm) {
              btnConfirm.onclick = async () => {
                const toInsert = validatedRows.filter(r => r.valid);

    // -------------------------------------------------------------------------
    // MODUL 6: JADWAL MENGAJAR & TUGAS (HARIAN, MINGGUAN, MULTI-PERAN, BENTROK)
    // -------------------------------------------------------------------------
    function checkScheduleConflict({ id = null, teacher_id, class_id = null, school_year_id, hari, jam_mulai, jam_selesai, kategori = 'KBM_REGULER' }) {
      const startA = timeToMinutes(jam_mulai);
      const endA = timeToMinutes(jam_selesai);
      if (endA <= startA) {
        return 'Jam selesai harus lebih besar daripada jam mulai.';
      }

      for (const s of state.schedules) {
        if (id && s.id === id) continue;
        if (s.school_year_id !== school_year_id || s.hari !== hari) continue;

        const startB = timeToMinutes(s.jam_mulai);
        const endB = timeToMinutes(s.jam_selesai);
        const overlaps = startA < endB && endA > startB;
        if (!overlaps) continue;

        if (s.teacher_id === teacher_id) {
          const sKat = getKategoriInfo(s.kategori || 'KBM_REGULER');
          const title = s.nama_tugas || (state.subjects.find(sub => sub.id === s.subject_id)?.nama_mapel) || sKat.label;
          return `Bentrok Jadwal Guru! Guru ini sudah memiliki tugas [${sKat.label}] "${title}" pada pukul ${s.jam_mulai}–${s.jam_selesai}.`;
        }
        if (class_id && s.class_id && s.class_id === class_id) {
          const tch = state.teachers.find(t => t.id === s.teacher_id);
          const cls = state.classes.find(c => c.id === s.class_id);
          return `Bentrok Jadwal Kelas! Kelas ${cls?.nama_kelas || '-'} sudah diisi oleh ${tch?.nama_lengkap || '-'} pada pukul ${s.jam_mulai}–${s.jam_selesai}.`;
        }
      }
      return null;
    }

    function renderSchedulesModule(container) {
      const activeYear = state.schoolYears.find(y => y.is_active);
      const filteredSchedules = state.schedules
        .filter(s => {
          if (activeYear && s.school_year_id !== activeYear.id) return false;
          if (state.scheduleViewMode === 'daily' && s.hari !== state.scheduleFilterDay) return false;
          if (state.scheduleFilterKategori !== 'all' && (s.kategori || 'KBM_REGULER') !== state.scheduleFilterKategori) return false;
          if (state.scheduleFilterTeacher !== 'all' && s.teacher_id !== state.scheduleFilterTeacher) return false;
          if (state.scheduleFilterClass !== 'all' && s.class_id !== state.scheduleFilterClass) return false;
          if (state.scheduleFilterSubject !== 'all' && s.subject_id !== state.scheduleFilterSubject) return false;
          return true;
        })
        .sort((a, b) => timeToMinutes(a.jam_mulai) - timeToMinutes(b.jam_mulai));

      container.innerHTML = `

          <div class="flex flex-wrap items-center justify-between gap-3">

                <i data-lucide="clock" class="w-4 h-4"></i> Jam Pelajaran

              <button id="btn-import-schedule-excel" class="px-3.5 py-2.5 rounded-xl bg-white hover:bg-[#EFEFFD] text-[#6C5CE7] text-xs font-bold border border-[#ECE9FE] inline-flex items-center gap-1.5">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Impor Jadwal
              </button>
              <button id="btn-add-schedule" class="px-4 py-2.5 rounded-xl bg-[#6C5CE7] hover:bg-[#5A4BD1] text-white text-xs font-bold inline-flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i> Tambah Jadwal
              </button>

          </div>

          <div class="bg-white rounded-3xl p-5 shadow-bento border border-white space-y-4">

            <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-[#F0F1F7]">
              <span class="text-xs font-bold text-[#9499B7] shrink-0 mr-1">Kategori:</span>
              <button data-schkat="all" class="sch-kat-pill px-3 py-1.5 rounded-full text-xs font-bold shrink-0 transition ${state.scheduleFilterKategori === 'all' ? 'bg-[#6C5CE7] text-white' : 'bg-[#F4F5FA] text-[#5A607F] hover:bg-[#EFEFFD]'}">Semua Tugas</button>
              ${Object.entries(KATEGORI_TUGAS).map(([kKey, kVal]) => `
                <button data-schkat="${kKey}" class="sch-kat-pill px-3 py-1.5 rounded-full text-xs font-bold shrink-0 transition ${state.scheduleFilterKategori === kKey ? 'bg-[#6C5CE7] text-white' : 'bg-[#F4F5FA] text-[#5A607F] hover:bg-[#EFEFFD]'}">${kVal.label}</button>
